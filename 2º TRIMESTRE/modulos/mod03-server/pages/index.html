        /* Container Principal */

            background: rgba(20, 20, 20, 0.6);
            padding: 3rem 2rem;
            border-radius: 15px;
            border: 1px solid rgba(255, 0, 60, 0.2);
            backdrop-filter: blur(10px);

            width: 90%;

            color: #ff003c;
            margin-bottom: 1rem;
            text-shadow: 0 0 15px rgba(255, 0, 60, 0.6);
            animation: pulse 2s infinite;
        }

        /* Título Estilo Banda */
        h3 {
            font-family: 'Metal Mania', cursive;
            font-size: 3rem;
            letter-spacing: 2px;
            color: #ffffff;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
        }

        /* Texto de Boas-vindas */
        p {
            font-size: 1.1rem;
            color: #b3b3b3;
            margin-bottom: 2.5rem;
            font-weight: 300;
        }

        /* Botão / Rota Moderna */
        .btn-route {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-decoration: none;
            color: #ffffff;
            background: linear-gradient(45deg, #ff003c, #990024);
            padding: 1rem 2.5rem;
            border-radius: 50px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 0, 60, 0.4);
        }

        .btn-route:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(255, 0, 60, 0.6);
            background: linear-gradient(45deg, #ff1a4e, #b3002a);
        }

        .btn-route:active {
            transform: translateY(-1px);
        }

        /* Animações */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }

    <div class="container">
